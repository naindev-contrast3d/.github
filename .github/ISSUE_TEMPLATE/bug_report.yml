name: Bug Report
description: Create a report to help us reproduce and fix an issue
title: "fix: [short description of the bug]"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please provide a clear and concise description of the bug.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what was expected?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Exact steps or commands to reproduce the behavior.
      placeholder: |
        1. Run '...'
        2. Inspect output '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, browser, or runtime version (e.g., Python 3.12, Node.js 22, Chrome 130).
    validations:
      required: false
